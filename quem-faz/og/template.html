<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Molde de OG, QUEM FAZ</title>
<!--
  Molde 1200×630 das imagens de compartilhamento.
  Não é uma página do site: existe só para o Chromium fotografar (og/render.cjs).

  Parâmetros por query string:
    ?titulo=POR TUBARÃO&numero=+R$ 20&unidade=MILHÕES&legenda=...&cta=...

  O teste real desta imagem é ser lida em miniatura, no balão de um WhatsApp.
  Por isso: um título gigante, um número, e nada mais competindo.
-->
  <!-- Acumin Pro (texto) pelo kit da Adobe Fonts; a cópia self-hosted é a
       reserva. A Acumin Pro Wide (display) não está no kit e vem sempre de
       assets/brand/fontes/, é ela que desenha título, número e olho aqui.
       O render espera document.fonts.ready antes de medir, então as duas
       chegam inteiras antes da foto. -->
  <link rel="preconnect" href="https://use.typekit.net" crossorigin />
  <link rel="preconnect" href="https://p.typekit.net" crossorigin />
  <link rel="stylesheet" href="https://use.typekit.net/ojd2pjl.css" />
<link rel="stylesheet" href="../../assets/brand/css/tipografia.css" />
<link rel="stylesheet" href="../../assets/brand/css/tokens.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px;
    overflow: hidden;
    font-family: var(--fonte);
    color: var(--cor-texto);
    background: var(--cor-fundo);
  }

  .quadro { position: relative; width: 1200px; height: 630px; background: var(--grad-fundo); overflow: hidden; }

  /* textura de setas como máscara, ver _IDENTIDADE/CLAUDE.md */
  .quadro::before {
    content: ""; position: absolute; inset: 0;
    background-color: #fff;
    -webkit-mask-image: url("../../assets/brand/textura/setas-tile.svg");
            mask-image: url("../../assets/brand/textura/setas-tile.svg");
    -webkit-mask-size: var(--textura-tamanho);
            mask-size: var(--textura-tamanho);
    opacity: .085;
  }
  /* véu: sem ele o amarelo cai sobre o #0082BF do canto e reprova em contraste */
  .quadro::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(105deg, rgba(6,26,58,.86) 0%, rgba(10,33,72,.66) 46%, rgba(14,30,70,.12) 78%);
  }

  .retrato {
    position: absolute; right: -18px; bottom: -14px;
    height: 640px; width: auto;
    z-index: 1;
    filter: drop-shadow(-22px 8px 52px rgba(6,26,58,.6));
  }

  .conteudo {
    position: relative; z-index: 2;
    height: 100%;
    padding: 56px 62px 44px;
    display: flex; flex-direction: column;
    max-width: 830px;
  }
  /* nada encolhe: numa coluna flex apertada o navegador esmaga a régua até
     sumir e come o rodapé por baixo. Melhor estourar visível do que sumir. */
  .conteudo > * { flex: none; }

  /* Não é mais uma sobrancelha: é a primeira linha do título, na Extra
     Light. A miniatura do WhatsApp precisa da frase inteira, "Quem faz por
     Tubarão", e não de um rótulo pequeno em cima de outra coisa. O amarelo
     da identidade fica com a régua, logo abaixo do título. */
  .olho {
    font-family: var(--fonte-display);
    font-weight: var(--peso-display-leve); font-size: 40px;
    letter-spacing: .05em; text-transform: uppercase;
    line-height: 1;
    color: var(--pp-azul-claro);
  }

  /* Wide Black: é a largura do lockup, e numa miniatura de WhatsApp a massa
     da Black é o que ainda se lê a 300 px de largura. A expandida ocupa cerca
     de um quinto a mais, então o teto do ajuste automático desceu junto. */
  h1 {
    margin: 18px 0 0;
    font-family: var(--fonte-display);
    font-weight: var(--peso-display-forte); text-transform: uppercase;
    font-size: 84px; line-height: .88; letter-spacing: -.03em;
  }

  .regua { width: 120px; height: 6px; background: var(--cor-acento); margin: 30px 0 24px; }

  .numero {
    font-family: var(--fonte-display);
    font-weight: var(--peso-display-forte); color: var(--cor-acento);
    font-size: 64px; line-height: .94; letter-spacing: -.03em;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  .numero .un { font-size: 34px; letter-spacing: .06em; }
  /* só o sinal de mais fica fino, como nas páginas */
  .numero .mais { font-weight: var(--peso-display-leve); }

  /* A palavra do assunto em pincel, como a assinatura QUEM FAZ REPRESENTA
     faz: a preposição em letra de forma, o assunto à mão. Uma palavra, que é
     a regra do --fonte-brush.

     Fica branca, e não amarela: no quadro já são amarelos a régua e o número,
     e um terceiro amarelo tira o número do lugar de destaque. Aqui quem
     destaca é o traço, não a cor. */
  .pincel {
    font-family: var(--fonte-brush);
    font-weight: 400;
    font-size: 1.1em;
    padding-inline: .1em .06em;
  }

  .legenda {
    margin-top: 15px;
    font-size: 24px; line-height: 1.32;
    color: #fff;
    max-width: 24ch;
  }

  .rodape { margin-top: auto; padding-top: 18px; display: flex; align-items: flex-end; gap: 22px; }
  .rodape img { width: 158px; display: block; }
  /* A tarja de chamada. Amarelo #FFC400 com texto #061A3A é o par canônico
     (10,8:1), o único elemento da imagem que precisa gritar de longe, porque
     no balão do WhatsApp a miniatura tem uns 300 px de largura. */
  .rodape .cta {
    display: inline-block;
    background: var(--cor-acento);
    color: var(--cor-sobre-acento);
    font-size: 21px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    padding: 11px 22px;
    border-radius: 999px;
    margin-bottom: 10px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="quadro">
    <img class="retrato" id="retrato" src="../../assets/brand/foto/pepe-busto-1400.webp" alt="" />
    <div class="conteudo">
      <div class="olho">Quem faz</div>
      <h1><span id="titulo">POR</span> <span class="pincel" id="destaque">TUBARÃO</span></h1>
      <div class="regua"></div>
      <div class="numero"><span id="numero">R$ 18,2</span><span class="un" id="unidade">MILHÕES</span></div>
      <div class="legenda" id="legenda">destinados à cidade em três anos de mandato</div>
      <div class="rodape">
        <img src="../../assets/brand/marca/collaco-11223-escuro-960.webp" alt="Pepê Collaço 11223" />
        <div class="cta" id="cta">Clique e entenda</div>
      </div>
    </div>
  </div>

<script>
  const p = new URLSearchParams(location.search);
  const põe = (id, chave) => {
    const v = p.get(chave);
    if (v !== null) document.getElementById(id).textContent = v;
  };
  põe('titulo', 'titulo');
  põe('destaque', 'destaque');
  põe('numero', 'numero');
  põe('unidade', 'unidade');
  põe('legenda', 'legenda');

  if (!p.get('destaque')) document.getElementById('destaque').remove();

  // o sinal de mais é o único pedaço fino do número
  const n = document.getElementById('numero');
  n.innerHTML = n.textContent.replace(/^\+/, '<span class="mais">+</span>');
  põe('cta', 'cta');

  // sem número, o bloco inteiro sai e a legenda sobe
  if (p.get('numero') === '') {
    document.querySelector('.numero').style.display = 'none';
  }

  // O título entra no maior corpo que ainda cabe. Contar letras não resolve:
  // "POR TUBARÃO" e "PELA EDUCAÇÃO" têm quase o mesmo tamanho e larguras bem
  // diferentes. Então mede-se de verdade, e desce de 2 em 2 até parar de
  // estourar a caixa, assim as sete páginas ganham o maior título possível.
  const t = document.querySelector('h1');
  const caixa = document.querySelector('.conteudo');
  const coube = () => caixa.scrollHeight <= caixa.clientHeight;
  document.fonts.ready.then(() => {
    for (let px = 84; px >= 44 && !coube(); px -= 2) {
      t.style.fontSize = px + 'px';
    }
    document.documentElement.dataset.pronto = '1';
  });
</script>
</body>
</html>
