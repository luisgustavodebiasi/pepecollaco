<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Molde de OG — QUEM FAZ</title>
<!--
  Molde 1200×630 das imagens de compartilhamento.
  Não é uma página do site: existe só para o Chromium fotografar (og/render.cjs).

  Parâmetros por query string:
    ?titulo=POR TUBARÃO&numero=R$ 18,2&unidade=MILHÕES&legenda=...&rodape=...

  O teste real desta imagem é ser lida em miniatura, no balão de um WhatsApp.
  Por isso: um título gigante, um número, e nada mais competindo.
-->
<link rel="stylesheet" href="../../assets/brand/css/tipografia.css" />
<link rel="stylesheet" href="../../assets/brand/css/tokens.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px;
    overflow: hidden;
    font-family: var(--fonte);
    color: var(--cor-texto);
    background: var(--cor-fundo);
  }

  .quadro { position: relative; width: 1200px; height: 630px; background: var(--grad-fundo); overflow: hidden; }

  /* textura de setas como máscara — ver _IDENTIDADE/CLAUDE.md */
  .quadro::before {
    content: ""; position: absolute; inset: 0;
    background-color: #fff;
    -webkit-mask-image: url("../../assets/brand/textura/setas-tile.svg");
            mask-image: url("../../assets/brand/textura/setas-tile.svg");
    -webkit-mask-size: var(--textura-tamanho);
            mask-size: var(--textura-tamanho);
    opacity: .085;
  }
  /* véu: sem ele o amarelo cai sobre o #0082BF do canto e reprova em contraste */
  .quadro::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(105deg, rgba(6,26,58,.86) 0%, rgba(10,33,72,.66) 46%, rgba(14,30,70,.12) 78%);
  }

  .retrato {
    position: absolute; right: -18px; bottom: -14px;
    height: 640px; width: auto;
    z-index: 1;
    filter: drop-shadow(-22px 8px 52px rgba(6,26,58,.6));
  }

  .conteudo {
    position: relative; z-index: 2;
    height: 100%;
    padding: 56px 62px 44px;
    display: flex; flex-direction: column;
    max-width: 830px;
  }
  /* nada encolhe: numa coluna flex apertada o navegador esmaga a régua até
     sumir e come o rodapé por baixo. Melhor estourar visível do que sumir. */
  .conteudo > * { flex: none; }

  .olho {
    display: flex; align-items: center; gap: 15px;
    font-weight: 700; font-size: 24px;
    letter-spacing: .34em; text-transform: uppercase;
    color: var(--pp-azul-claro);
  }
  .olho::before { content: ""; width: 48px; height: 5px; background: var(--cor-acento); }

  h1 {
    margin: 18px 0 0;
    font-weight: 700; text-transform: uppercase;
    font-size: 112px; line-height: .88; letter-spacing: -.022em;
  }

  .regua { width: 120px; height: 6px; background: var(--cor-acento); margin: 30px 0 24px; }

  .numero {
    font-weight: 700; color: var(--cor-acento);
    font-size: 70px; line-height: .94; letter-spacing: -.02em;
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  .numero .un { font-size: 37px; letter-spacing: .04em; }

  .legenda {
    margin-top: 15px;
    font-size: 24px; line-height: 1.32;
    color: #fff;
    max-width: 24ch;
  }

  .rodape { margin-top: auto; padding-top: 18px; display: flex; align-items: flex-end; gap: 22px; }
  .rodape img { width: 158px; display: block; }
  .rodape .nota {
    font-size: 17px; letter-spacing: .18em; text-transform: uppercase;
    font-weight: 700; color: var(--pp-azul-claro);
    padding-bottom: 6px;
  }
</style>
</head>
<body>
  <div class="quadro">
    <img class="retrato" id="retrato" src="../../assets/brand/foto/pepe-busto-1400.webp" alt="" />
    <div class="conteudo">
      <div class="olho">Quem faz</div>
      <h1 id="titulo">POR TUBARÃO</h1>
      <div class="regua"></div>
      <div class="numero"><span id="numero">R$ 18,2</span><span class="un" id="unidade">MILHÕES</span></div>
      <div class="legenda" id="legenda">destinados à cidade em três anos de mandato</div>
      <div class="rodape">
        <img src="../../assets/brand/marca/collaco-11223-escuro-960.webp" alt="Pepê Collaço 11223" />
        <div class="nota" id="rodape">Quem faz representa</div>
      </div>
    </div>
  </div>

<script>
  const p = new URLSearchParams(location.search);
  const põe = (id, chave) => {
    const v = p.get(chave);
    if (v !== null) document.getElementById(id).textContent = v;
  };
  põe('titulo', 'titulo');
  põe('numero', 'numero');
  põe('unidade', 'unidade');
  põe('legenda', 'legenda');
  põe('rodape', 'rodape');

  // sem número, o bloco inteiro sai e a legenda sobe
  if (p.get('numero') === '') {
    document.querySelector('.numero').style.display = 'none';
  }

  // O título entra no maior corpo que ainda cabe. Contar letras não resolve:
  // "POR TUBARÃO" e "PELA EDUCAÇÃO" têm quase o mesmo tamanho e larguras bem
  // diferentes. Então mede-se de verdade, e desce de 2 em 2 até parar de
  // estourar a caixa — assim as sete páginas ganham o maior título possível.
  const t = document.getElementById('titulo');
  const caixa = document.querySelector('.conteudo');
  const coube = () => caixa.scrollHeight <= caixa.clientHeight;
  document.fonts.ready.then(() => {
    for (let px = 112; px >= 54 && !coube(); px -= 2) {
      t.style.fontSize = px + 'px';
    }
    document.documentElement.dataset.pronto = '1';
  });
</script>
</body>
</html>
